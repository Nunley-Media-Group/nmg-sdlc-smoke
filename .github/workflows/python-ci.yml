name: Python CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and acceptance tests
        run: python -m pytest
      - name: Acceptance features
        run: python -m pytest tests/features
      - name: Ruff
        run: python -m ruff check .
